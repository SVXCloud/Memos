name: Publish Memos /memo image

on:
  workflow_dispatch:
  push:
    tags:
      - "26.11.2-notes"
      - "26.11.2-notes.*"

# Serialize verification and updates to latest across all release refs.
concurrency:
  group: memos-subpath-image
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_VERSION: "26.11.2"
  IMAGE_TAG: "26.11.2-notes"

jobs:
  backend-tests:
    name: Backend and S3 tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go
      - run: go test -race ./server/... ./core/... ./internal/deployment ./markdown/... ./scripts/...

  image:
    name: Build and verify linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-web
      - name: Frontend type and unit tests
        if: matrix.arch == 'amd64'
        working-directory: web
        run: |
          pnpm lint
          pnpm test --testTimeout=20000
      - name: Build embedded frontend
        working-directory: web
        run: pnpm release
      - uses: docker/setup-buildx-action@v3
      - name: Build the candidate image
        env:
          ARCH: ${{ matrix.arch }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker buildx build --load --platform "linux/$ARCH" \
            --build-arg "VERSION=$UPSTREAM_VERSION" --build-arg "COMMIT=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$IMAGE_TAG" \
            -f scripts/Dockerfile -t "memos-under-test:$ARCH" .
      - name: Install Chromium
        if: matrix.arch == 'amd64'
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify the actual image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          browser=()
          if [[ "$ARCH" == amd64 ]]; then browser+=(--browser); fi
          python3 scripts/subpath_smoke_test.py "memos-under-test:$ARCH" "${browser[@]}"
      - name: Save the verified image
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save "memos-under-test:$ARCH" | gzip -1 > "memos-$ARCH.tar.gz"
      - uses: actions/upload-artifact@v6
        with:
          name: tested-image-${{ matrix.arch }}
          path: memos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified AMD64 and ARM64 images to GHCR
    needs: [backend-tests, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: tested-image-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the tested artifacts and publish both tags
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/memos"
          manifests=()
          for arch in amd64 arm64; do
            docker load --input "memos-$arch.tar.gz"
            temporary="$image:verified-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$arch"
            docker tag "memos-under-test:$arch" "$temporary"
            push_output="$(docker push "$temporary")"
            printf '%s\n' "$push_output"
            digest="$(awk '/digest: sha256:/ {for(i=1;i<=NF;i++) if ($i == "digest:") print $(i+1)}' <<< "$push_output")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            manifests+=("$image@$digest")
          done
          docker buildx imagetools create -t "$image:$IMAGE_TAG" -t "$image:latest" "${manifests[@]}"
          for tag in "$IMAGE_TAG" latest; do
            docker buildx imagetools inspect --raw "$image:$tag" |
              jq -e '([.manifests[].platform | [.os, .architecture]] | sort) == [["linux","amd64"],["linux","arm64"]]'
          done
